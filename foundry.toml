[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]   
solc_version = "0.8.25"
evm_version = "cancun"
auto_detect_remappings = false

# Monad's execution rules for local builds, tests, scripts and simulation: its gas model, opcode
# pricing, precompiles and 128 KB code size limit. Foundry picks the hardfork on Monad testnet itself.
network = "monad"

# The optimizer is off by default in Foundry 1.x
optimizer = true
optimizer_runs = 200

# The deploy script writes deployments/<chainId>.json; fork tests read it.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
# Monad's public RPC: forge scripts get HTTP 503 from Alchemy's Monad testnet endpoint
monad_testnet = "${MONAD_RPC_URL}"
monad_mainnet = "${ALCHEMY_MONAD_MAINNET_RPC_URL}"

# An Etherscan V2 key verifies on Monadscan
[etherscan]
monad_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 10143 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
